<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>STATRI | Cadastre-se</title>

  <link rel="stylesheet" href="/css/cadastro.css">

  <link rel="icon" type="image/png" href="/assets/img/Gemini_Generated_Image_l687twl687twl687.png">
</head>

<body>

  <!-- =========================================
       HEADER
       ========================================= -->

  <header class="topbar">

    <div class="logo">
      ST<span class="a">A</span>TRI

      <small>
        performance through precision
      </small>
    </div>


    <nav class="menu">

      <a href="#">
        Sobre
      </a>

      <a href="/login">
        Entrar
      </a>

      <span class="bandeira" aria-label="Português do Brasil">
        <img src="/assets/img/brasil.png" alt="Bandeira do Brasil" class="bandeiraBR">
      </span>

    </nav>

  </header>


  <!-- =========================================
       ÁREA PRINCIPAL
       ========================================= -->

  <main class="hero">


    <!-- FOTO ESQUERDA -->

    <div class="foto foto-esquerda">
      <img src="/assets/img/20260628_093433.jpg" alt="Atleta durante corrida">
    </div>


    <!-- =====================================
         CADASTRO
         ===================================== -->

    <section class="centro">


      <!-- ===================================
           BANNER DO TÍTULO
           =================================== -->

      <div class="titulo-banner">

        <div class="titulo-overlay"></div>

        <div class="titulo-conteudo">

          <h1>
            Não apenas treine.<br>
            Supere-se.
          </h1>

          <p class="sub">
            Transforme seus dados de natação, bike e corrida
            em evolução real com estatísticas de elite.
          </p>

        </div>

      </div>


      <!-- ===================================
           FORMULÁRIO
           =================================== -->

      <form class="form" id="form">


        <!-- NOME -->

        <div class="campo campo-full">

          <label for="nome">
            Nome completo
          </label>

          <input id="nome" name="nome" type="text" placeholder="Seu nome" autocomplete="name" required>

        </div>


        <!-- E-MAIL -->

        <div class="campo campo-full">

          <label for="email">
            E-mail
          </label>

          <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>

        </div>


        <!-- =================================
             DADOS COMPLEMENTARES
             ================================= -->

        <div class="dados-complementares">


          <!-- SENHA -->

          <div class="campo">

            <label for="senha">
              Senha
            </label>

            <input id="senha" name="senha" type="password" placeholder="••••••••" autocomplete="new-password" required>

          </div>


          <!-- DATA DE NASCIMENTO -->

          <div class="campo">

            <label for="nascimento">
              Data de nascimento
            </label>

            <input id="nascimento" name="nascimento" type="date" required>

          </div>


          <!-- PESO -->

          <div class="campo">

            <label for="peso">
              Peso
            </label>

            <input id="peso" name="peso" type="number" step="0.01" min="0" placeholder="Ex: 70,5">

          </div>


          <!-- ALTURA -->

          <div class="campo">

            <label for="altura">
              Altura
            </label>

            <input id="altura" name="altura" type="number" step="0.01" min="0" placeholder="Ex: 1,80">

          </div>

        </div>


        <!-- =================================
             JÁ É MEMBRO
             ================================= -->

        <p class="aviso">

          Já é membro?

          <a href="/login">
            Acesse aqui
          </a>

        </p>


        <!-- =================================
             BOTÃO
             ================================= -->

        <button class="botao" type="submit">
          Cadastre-se
        </button>


        <!-- ERRO -->

        <p id="errorMessage" class="error-message"></p>

      </form>

    </section>


    <!-- FOTO DIREITA -->

    <div class="foto foto-direita">

      <img src="/assets/img/IMG-20250126-WA0032.jpg" alt="Atleta pedalando">

    </div>

  </main>


  <!-- =========================================
       FOOTER
       ========================================= -->

  <footer class="footer">


    <div class="logo">
      ST<span class="a">A</span>TRI
    </div>


    <nav>

      <a href="#">
        Recursos
      </a>

      <a href="#">
        História
      </a>

      <a href="#">
        Sobre
      </a>

    </nav>


    <div class="social">

      <a href="#">
        <span class="icone ig"></span>
        Instagram
      </a>

      <a href="#">
        <span class="icone in"></span>
        Linkedin
      </a>

    </div>

  </footer>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script type="module" src="/js/cadastro.js"></script>

</body>

</html>
