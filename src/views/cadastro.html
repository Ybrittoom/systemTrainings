<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>STATRI | Cadastre-se</title>

  <link rel="stylesheet" href="/css/cadastro.css">

  <link rel="icon" type="image/png" href="/assets/img/Gemini_Generated_Image_l687twl687twl687.png">

</head>


<body>


  <!-- =========================================
       HEADER
       ========================================= -->

  <header class="topbar">

    <div class="logo">

      ST<span class="a">A</span>TRI

      <small>
        performance through precision
      </small>

    </div>


    <nav class="menu">

      <a href="#">
        Sobre
      </a>

      <a href="/login">
        Entrar
      </a>

      <span class="bandeira" aria-label="Português do Brasil">

        <img src="/assets/img/brasil.png" alt="Bandeira do Brasil" class="bandeiraBR">

      </span>

    </nav>

  </header>



  <!-- =========================================
       ÁREA PRINCIPAL
       ========================================= -->

  <main class="hero">


    <!-- =======================================
         ÁREA DO CADASTRO
         ======================================= -->

    <section class="cadastro-container">


      <!-- =====================================
           BANNER
           ===================================== -->

      <div class="titulo-banner">


        <!-- CAMADA ESCURA -->

        <div class="titulo-overlay"></div>


        <!-- CONTEÚDO DO BANNER -->

        <div class="titulo-conteudo">

          <h1>
            Não apenas treine.
            <br>
            <span>Supere-se.</span>
          </h1>


          <div class="linha-vermelha"></div>


          <p>
            Transforme seus dados de desempenho
            em evolução real com estatísticas de elite.
          </p>

        </div>

      </div>



      <!-- =====================================
           CARD DO FORMULÁRIO
           ===================================== -->

      <div class="form-card">


        <form class="form" id="form">


          <!-- =================================
               NOME
               ================================= -->

          <div class="campo campo-full">

            <label for="nome">
              Nome completo
            </label>

            <input id="nome" name="nome" type="text" placeholder="Seu nome" autocomplete="name" required>

          </div>



          <!-- =================================
               E-MAIL
               ================================= -->

          <div class="campo campo-full">

            <label for="email">
              E-mail
            </label>

            <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>

          </div>



          <!-- =================================
               SENHA / NASCIMENTO
               ================================= -->

          <div class="dados-linha">


            <!-- SENHA -->

            <div class="campo">

              <label for="senha">
                Senha
              </label>

              <input id="senha" name="senha" type="password" placeholder="••••••••" autocomplete="new-password"
                required>

            </div>



            <!-- DATA -->

            <div class="campo">

              <label for="nascimento">
                Data de nascimento
              </label>

              <input id="nascimento" name="nascimento" type="date" required>

            </div>


          </div>



          <!-- =================================
               PESO / ALTURA
               ================================= -->

          <div class="dados-linha">


            <!-- PESO -->

            <div class="campo">

              <label for="peso">
                Peso
              </label>

              <input id="peso" name="peso" type="number" step="0.01" min="0" placeholder="Ex: 70,5">

            </div>



            <!-- ALTURA -->

            <div class="campo">

              <label for="altura">
                Altura
              </label>

              <input id="altura" name="altura" type="number" step="0.01" min="0" placeholder="Ex: 1,80">

            </div>


          </div>



          <!-- =================================
               LOGIN
               ================================= -->

          <p class="aviso">

            Já é membro?

            <a href="/login">
              Acesse aqui
            </a>

          </p>



          <!-- =================================
               BOTÃO
               ================================= -->

          <button class="botao" type="submit">
            Cadastre-se
          </button>



          <!-- =================================
               ERRO
               ================================= -->

          <p id="errorMessage" class="error-message"></p>


        </form>

      </div>


    </section>


  </main>



  <!-- =========================================
       FOOTER
       ========================================= -->

  <footer class="footer">


    <div class="logo">

      ST<span class="a">A</span>TRI

      <small>
        performance through precision
      </small>

    </div>



    <nav>

      <a href="#">
        Recursos
      </a>

      <a href="#">
        História
      </a>

      <a href="#">
        Sobre
      </a>

    </nav>



    <div class="social">


      <a href="#">

        <span class="icone ig"></span>

        Instagram

      </a>


      <a href="#">

        <span class="icone in"></span>

        Linkedin

      </a>


    </div>


  </footer>



  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script type="module" src="/js/cadastro.js"></script>


</body>

</html>
