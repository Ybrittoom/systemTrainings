<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STATRI | Entrar</title>
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="logo">
        ST<span class="a">A</span>TRI
        <small>performance through precision</small>
      </div>
      <nav class="menu">
        <a href="#">Sobre</a>
        <span class="bandeira" aria-label="Português do Brasil"><img src="/assets/img/brasil.png" alt="bandeiraBR" class="bandeiraBR"></span>
      </nav>
    </header>

    <main class="hero">
      <div class="foto"><img src="/assets/img/20260628_093433.jpg" alt="foto_corrida" class="imgCorrida"></div>

      <section class="centro">
        <h1>Bem-vindo de volta.<br />Continue evoluindo.</h1>
        <p class="sub">Acesse seus dados de natação, bike e corrida.</p>

        <form class="form" id="form">
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="emailInput" type="email" placeholder="seu@email.com" required />
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senhaInput" type="password" placeholder="••••••••" required />
          </div>
          <div class="opcoes">
            <a href="#">Esqueci minha senha</a>
          </div>
          <button class="botao" type="submit">Entrar</button>
          <p id="errorMessage" style="color: red;"></p>
        </form>

        <p class="aviso">Não tem conta? <a href="/register">Cadastre-se aqui</a></p>
      </section>

      <div class="foto"><img src="/assets/img/IMG-20250126-WA0032.jpg" alt="fotoBike" class="imgCorrida"></div>
    </main>

    <footer class="footer">
      <div class="logo">ST<span class="a">A</span>TRI</div>
      <nav>
        <a href="#">Recursos</a>
        <a href="#">Historia</a>
        <a href="#">Sobre</a>
      </nav>
      <div class="social">
        <a href="#"><span class="icone ig"></span> Instagram</a>
        <a href="#"><span class="icone in"></span> Linkedin</a>
      </div>
    </footer>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
